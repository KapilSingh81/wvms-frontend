<div class="min-h-screen flex flex-col bg-[#F5F7FA]">
    <div class="w-full sticky top-0 z-99 border-b border-gray-200/80 backdrop-blur-sm bg-white/95">
        <header class="hidden lg:flex items-center justify-between gap-6 px-6 lg:px-10 h-16">
            <!-- ---------- LEFT: LOGO + NAV ---------- -->
            <div class="flex items-center gap-4">
                <a routerLink="/" class="flex items-center gap-2 shrink-0">
                    <img class="w-16 h-9 object-contain" src="images/project-logo.png" alt="WVMS Logo" />
                </a>

                <!-- Divider -->
                <div class="w-px h-6 bg-gray-200"></div>

                <!-- Menu -->
                <nav class="flex items-center gap-1">
                    @for (data of menu(); track data?.name) {
                    <!-- ===== SIMPLE MENU ===== -->
                    @if (!data?.subNav?.length) {
                    <a [routerLink]="data.path" (click)="onMenuItemClick(data, $event)"
                        class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 group"
                        [ngClass]="{
                  'text-[#4f39f6] bg-[#4f39f6]/8': data?.isActive,
                  'text-gray-600 hover:text-[#4f39f6] hover:bg-gray-50': !data?.isActive,
                }">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75"
                            class="w-4.5 h-4.5 transition-colors"
                            [attr.stroke]="data?.isActive ? '#4f39f6' : 'currentColor'">
                            <path [attr.d]="data.iconPath"></path>
                        </svg>
                        <span>{{ data?.name }}</span>
                    </a>
                    }

                    <!-- ===== MENU WITH SUBMENU ===== -->
                    @else {
                    <div class="relative group">
                        <button
                            class="relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
                            [ngClass]="{
                    'text-[#4f39f6] bg-[#4f39f6]/8': data?.isActive,
                    'text-gray-600 hover:text-[#4f39f6] hover:bg-gray-50': !data?.isActive,
                  }">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75"
                                class="w-4.5 h-4.5 transition-colors"
                                [attr.stroke]="data?.isActive ? '#4f39f6' : 'currentColor'">
                                <path [attr.d]="data.iconPath"></path>
                            </svg>
                            <span>{{ data?.name }}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor"
                                class="w-3.5 h-3.5 transition-transform duration-200 group-hover:rotate-180">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>
                        </button>

                        <!-- ---------- SUBMENU DROPDOWN ---------- -->
                        <div class="absolute left-0 top-full pt-3 hidden group-hover:block z-50">
                            <div
                                class="w-64 bg-white rounded-xl border border-gray-100 shadow-lg shadow-gray-200/50 overflow-hidden py-1.5">
                                <ul>
                                    @for (subMenu of data?.subNav; track subMenu?.name) {
                                    <li>
                                        <a [routerLink]="subMenu.path" (click)="onMenuItemClick(subMenu, $event)"
                                            class="flex items-center justify-between gap-3 px-4 py-2.5 mx-1.5 rounded-lg text-sm transition-all duration-150"
                                            [ngClass]="{
                              'text-[#4f39f6] bg-[#4f39f6]/8 font-medium': subMenu?.isActive,
                              'text-gray-600 hover:bg-gray-50 hover:text-[#4f39f6]':
                                !subMenu?.isActive,
                            }">
                                            <div class="flex items-center gap-3 min-w-0">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                    stroke-width="1.75" class="w-4 h-4 shrink-0 transition-colors"
                                                    [attr.stroke]="
                                  subMenu?.isActive ? '#4f39f6' : subMenu?.color || 'currentColor'
                                ">
                                                    <path [attr.d]="subMenu.iconPath"></path>
                                                </svg>
                                                <span class="truncate">{{ subMenu?.name }}</span>
                                            </div>
                                            @if (subMenu?.isActive) {
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                                stroke-width="2.5" stroke="#4f39f6" class="w-4 h-4 shrink-0">
                                                <path stroke-linecap="round" stroke-linejoin="round"
                                                    d="M4.5 12.75l6 6 9-13.5" />
                                            </svg>
                                            }
                                        </a>
                                    </li>
                                    }
                                </ul>
                            </div>
                        </div>
                    </div>
                    }
                    }
                </nav>
            </div>

            <!-- ---------- RIGHT: USER MENU ---------- -->
            <div class="flex items-center gap-2">
                <!-- Notifications -->
                <button
                    class="relative w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 hover:text-[#4f39f6] hover:bg-gray-50 transition-all duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                    </svg>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
                </button>

                <div class="w-px h-6 bg-gray-200"></div>

                <div class="relative group">
                    <button
                        class="flex items-center gap-2.5 pl-1.5 pr-3 py-1.5 rounded-full hover:bg-gray-50 transition-all duration-200">
                        <div
                            class="w-8 h-8 rounded-full overflow-hidden bg-linear-to-br from-[#4f39f6] to-[#7c3aed] flex items-center justify-center text-white text-sm font-semibold shadow-sm">
                            @if (user; as currentUser) {
                            @if (currentUser.image) {
                            <img [src]="currentUser.image" [alt]="currentUser.name || 'User'"
                                class="w-full h-full object-cover" />
                            } @else {
                            {{ currentUser.name.charAt(0).toUpperCase() || 'A' }}
                            }
                            } @else {
                            A
                            }
                        </div>
                        <!-- ✅ Dynamic Name + Role -->
                        <div class="hidden xl:flex flex-col items-start leading-tight">
                            <span class="text-sm font-medium text-gray-800">
                                {{ user?.name }}
                            </span>
                            <span class="text-[10px] text-gray-400">
                                {{ user?.role }}
                            </span>
                        </div>

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor"
                            class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200 group-hover:rotate-180">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                        </svg>
                    </button>

                    <!-- User Dropdown -->
                    <div class="absolute right-0 top-full pt-3 hidden group-hover:block z-50">
                        <div
                            class="w-44 bg-white rounded-xl border border-gray-100 shadow-lg shadow-gray-200/50 overflow-hidden">
                            <!-- ✅ Dynamic User info header -->
                            <!-- <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="w-10 h-10 rounded-full overflow-hidden bg-linear-to-br from-[#4f39f6] to-[#7c3aed] flex items-center justify-center text-white font-semibold">
                                        @if (user; as currentUser) {
                                        @if (currentUser.image) {
                                        <img [src]="currentUser.image" [alt]="currentUser.name || 'User'"
                                            class="w-full h-full object-cover" />
                                        } @else {
                                        {{ currentUser.name.charAt(0).toUpperCase() || 'A' }}
                                        }
                                        } @else {
                                        A
                                        }
                                    </div>
                                    <div class="flex flex-col leading-tight min-w-0">
                                        <span class="text-sm font-semibold text-gray-800 truncate">
                                            {{ user?.name }}
                                        </span>
                                        <span class="text-xs text-gray-400 truncate">
                                            {{ user?.email }}
                                        </span>
                                    </div>
                                </div>
                            </div> -->

                            <!-- Menu items -->
                            <ul class="py-1.5">
                                <li>
                                    <a
                                        class="flex items-center gap-3 px-4 py-2 mx-1.5 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-[#4f39f6] cursor-pointer transition-all duration-150">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                            stroke-width="1.75" stroke="currentColor" class="w-4 h-4">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                                        </svg>
                                        <span>My Profile</span>
                                    </a>
                                </li>
                            </ul>

                            <!-- Logout -->
                            <div class="border-t border-gray-100 py-1.5">
                                <button (click)="logout()"
                                    class="w-full flex items-center gap-3 px-4 py-2 mx-1.5 rounded-lg text-sm text-red-500 hover:bg-red-50 transition-all duration-150">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.75" stroke="currentColor" class="w-4 h-4">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3" />
                                    </svg>
                                    <span class="font-medium">Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="flex-1 px-4 lg:px-10 py-6 transition-colors duration-300">
        <router-outlet />
    </main>

    <!-- ============ FOOTER ============ -->
    <app-footer />
</div>
